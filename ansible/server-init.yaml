---
- name: Setup server
  hosts: localhost
  connection: local
  tasks:
  - name: Make sure that encrypted_file_size variable is defined
    set_fact:
      encrypted_file_size: "{{ encrypted_file_size | default('0') | string }}"
  - name: Set encrypted filesystem enabled variable
    set_fact:
      encrypted_fs_enabled: "{{ encrypted_file_size != '0' }}"
  - name: Set backend working directory variable
    set_fact:
      backend_working_directory: "{{ '/afrodite-secure-storage/afrodite/backend' if (encrypted_fs_enabled | bool) else '/home/afrodite' }}"
  - name: Download dependencies
    include_tasks: tasks/apt-dependencies.yaml
  - name: Create users
    include_tasks: tasks/create-users.yaml
  - name: Setup services
    include_tasks: tasks/setup-services.yaml
  - name: Setup tool scripts
    include_tasks: tasks/setup-tool-scripts.yaml

  - name: Check if firewall setup is already done
    stat:
      path: "/afrodite-iptables"
    register: firewall_config_dir
  - name: Setup firewall
    include_tasks: tasks/setup-firewall.yaml
    when: firewall_config_dir.stat.exists == False
  - debug:
      msg: "Firewall setup is already done"
    when: firewall_config_dir.stat.exists == True

  - name: Setup encrypted filesystem
    include_tasks: tasks/setup-encrypted-fs.yaml
    when: encrypted_fs_enabled | bool

  - debug:
      msg: "Encrypted filesystem setup skipped (encrypted_file_size={{ encrypted_file_size }})"
    when: not (encrypted_fs_enabled | bool)

  - debug:
      msg: "Server setup is now complete"
